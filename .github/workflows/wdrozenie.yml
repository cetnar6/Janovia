name: Wdrożenie na serwer

# Wysyła stronę na hosting OVH przez SFTP.
#
# Po co to, skoro jest cron na serwerze: OVH zablokował hostingowi połączenia
# wychodzące, więc cron.php nie dosięgnie 90minut.pl ani Facebooka. GitHub
# takiej blokady nie ma — pobiera dane u siebie i przywozi gotowe pliki tutaj.
# Połączenie idzie DO OVH, nie Z OVH, więc blokada go nie dotyczy.
#
# Dlaczego SFTP, a nie FTPS: serwer cluster121 na "AUTH TLS" odpowiada
# "500 This security scheme is not implemented", czyli szyfrowanego FTP nie
# obsługuje. Zwykły FTP odpada, bo przesyłałby hasło otwartym tekstem — a to
# samo konto ma dostęp również do drugiej strony na tym hostingu.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:            # wywoływane też po odświeżeniu danych
    secrets:
      FTP_HOST:     { required: true }
      FTP_USER:     { required: true }
      FTP_PASSWORD: { required: true }

# Dwa wdrożenia naraz mieszałyby pliki na serwerze w połowie transferu.
concurrency:
  group: wdrozenie
  cancel-in-progress: false

env:
  # Ścieżka WZGLĘDNA, liczona od katalogu logowania. Z ukośnikiem na początku
  # wskazywałaby korzeń systemu plików: przy FTP konto jest zamknięte w katalogu
  # domowym, ale SFTP w OpenSSH zwykle nie zakłada takiej klatki i "/janovia"
  # celowałoby wtedy w miejsce, gdzie nie ma prawa zapisu.
  ZDALNY_KATALOG: janovia

jobs:
  wyslij:
    runs-on: ubuntu-latest

    steps:
      # ref: main jest tu konieczne. Gdy ten workflow jest wywoływany po
      # aktualizacji danych, domyślny checkout pobrałby commit, który
      # URUCHOMIŁ przebieg — czyli stan sprzed dopisania świeżych wyników.
      # Wysłalibyśmy wtedy na serwer poprzednią wersję data/liga.json.
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Zainstaluj lftp i sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass

      # Klucz serwera wpisany na stałe zamiast ślepego akceptowania pierwszego
      # napotkanego (StrictHostKeyChecking=no). Runner GitHuba jest za każdym
      # razem nowy, więc bez tego każde połączenie ufałoby czemukolwiek, co
      # odpowie pod tym adresem. Klucz publiczny — może być jawny.
      - name: Przypnij klucz serwera
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/known_hosts <<'KLUCZ'
          ftp.cluster121.hosting.ovh.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJSgweEQn216+sUrv4A0HwrnvJi03tu/LPeJ176yB29a
          KLUCZ
          chmod 600 ~/.ssh/known_hosts
          echo "Odcisk przypiętego klucza:"
          ssh-keygen -lf ~/.ssh/known_hosts

      # Katalog "wysylka" zawiera dokładnie to, co ma trafić na serwer.
      # Łatwiej wskazać, co wysłać, niż budować regułę wykluczeń w lftp.
      - name: Przygotuj katalog do wysyłki
        run: |
          mkdir -p wysylka
          rsync -a ./ wysylka/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'dane' \
            --exclude 'sql' \
            --exclude 'logs' \
            --exclude 'wysylka' \
            --exclude '*.py' \
            --exclude '*.md' \
            --exclude '.DS_Store' \
            --exclude '.gitignore'
          echo "Do wysłania: $(find wysylka -type f | wc -l) plików, $(du -sh wysylka | cut -f1)"

      # UWAGA — ścieżki w -x należą do panelu administratora na serwerze,
      # nie do repozytorium. Panel zapisuje je z bazy MySQL przy każdym
      # zapisie zawodnika czy sponsora. Gdyby mirror --delete ich nie omijał,
      # każde wdrożenie kasowałoby pracę wykonaną w panelu.
      #
      # sshpass podaje hasło procesowi ssh, bo lftp przy sftp nie potrafi
      # zrobić tego sam — uruchamia zewnętrznego klienta ssh.
      # Osobny, głośny test logowania. Bez niego każda awaria wygląda tak samo
      # i nie wiadomo, czy zawiodło hasło, klucz hosta, czy dopiero transfer.
      - name: Sprawdź połączenie
        env:
          HOST: ${{ secrets.FTP_HOST }}
          UZYTKOWNIK: ${{ secrets.FTP_USER }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Host: [$HOST]  Użytkownik: [$UZYTKOWNIK]  Długość hasła: ${#SSHPASS}"
          lftp -c "set sftp:connect-program 'sshpass -e ssh -a -x -o StrictHostKeyChecking=yes'; debug 3; open -u '$UZYTKOWNIK',dummy sftp://$HOST; pwd; ls"

      # Cała komenda mirror w JEDNEJ linii. lftp ma własny parser i nie łamie
      # poleceń odwrotnym ukośnikiem tak jak shell — rozbicie na wiele linii
      # kończy polecenie w połowie.
      #
      # Ścieżki w -x należą do panelu administratora na serwerze, nie do
      # repozytorium. Panel zapisuje je z bazy MySQL przy każdym zapisie
      # zawodnika czy sponsora. Gdyby mirror --delete ich nie omijał, każde
      # wdrożenie kasowałoby pracę wykonaną w panelu.
      #
      # sshpass -e czyta hasło ze zmiennej SSHPASS, żeby nie trafiło do listy
      # procesów, gdzie widziałby je każdy inny proces na maszynie.
      - name: Wyślij na serwer
        env:
          HOST: ${{ secrets.FTP_HOST }}
          UZYTKOWNIK: ${{ secrets.FTP_USER }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set cmd:fail-exit true; set sftp:connect-program 'sshpass -e ssh -a -x -o StrictHostKeyChecking=yes'; set net:max-retries 3; set net:timeout 20; open -u '$UZYTKOWNIK',dummy sftp://$HOST; mkdir -f $ZDALNY_KATALOG; mirror --reverse --delete --verbose --parallel=2 -x '^uploads/' -x '^admin/inc/config\.php$' -x '^data/zawodnicy\.json$' -x '^data/posty\.json$' -x '^data/mecze-panelu\.json$' -x '^data/sponsorzy\.json$' wysylka/ $ZDALNY_KATALOG/"

      # config.php nie może leżeć w repozytorium — jest publiczne, a plik
      # zawiera hasło do bazy. Powstaje więc tutaj, z sekretów, i jest wgrywany
      # osobno. Mirror wyżej go omija (-x), więc nie zostanie skasowany.
      #
      # Krok pomijany, gdy brak sekretu DB_HASLO — wtedy plik trzeba wgrać
      # ręcznie klientem FTP, a wdrożenie i tak ma się udać.
      - name: Wyślij konfigurację panelu
        env:
          HOST: ${{ secrets.FTP_HOST }}
          UZYTKOWNIK: ${{ secrets.FTP_USER }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          DB_HASLO: ${{ secrets.DB_HASLO }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          # Warunek w shellu, a nie w "if:" kroku — kontekst secrets nie jest
          # tam dostępny, więc taki warunek zawsze wychodziłby fałszywy.
          if [ -z "$DB_HASLO" ]; then
            echo "Brak sekretu DB_HASLO — pomijam config.php."
            echo "Panel nie ruszy, dopóki plik nie trafi na serwer."
            exit 0
          fi
          mkdir -p konfiguracja
          # Generator zamiast podmianki w gotowym tekście: hasło przechodzi
          # przez var_export, więc apostrofy i ukośniki w haśle nie rozwalą
          # składni. Heredoc w apostrofach nic nie podstawia, a samo hasło
          # czytane jest ze zmiennej środowiskowej, nie z linii poleceń —
          # dzięki temu nie widać go na liście procesów.
          #
          # sqlite_plik pominięty celowo: db.php czyta go wyłącznie w gałęzi
          # sterownik === 'sqlite', a tu jest 'mysql'.
          cat > generuj-config.php <<'PHPEOF'
          <?php
          $config = [
              'sterownik'           => 'mysql',
              'mysql_host'          => 'kosmetejanovia.mysql.db',
              'mysql_baza'          => 'kosmetejanovia',
              'mysql_uzytkownik'    => 'kosmetejanovia',
              'mysql_haslo'         => (string) getenv('DB_HASLO'),
              'katalog_uploadow'    => 'uploads',
              'max_rozmiar_zdjecia' => 5 * 1024 * 1024,
              'fb_token'            => (string) getenv('FB_TOKEN'),
              'fb_page_id'          => (string) getenv('FB_PAGE_ID'),
          ];

          if ($config['mysql_haslo'] === '') {
              fwrite(STDERR, "DB_HASLO jest puste — przerywam.\n");
              exit(1);
          }

          $naglowek = "<?php\n"
              . "// Plik generowany przez .github/workflows/wdrozenie.yml.\n"
              . "// Nie edytuj go na serwerze — najbliższe wdrożenie go nadpisze.\n"
              . "// Aby zmienić hasło, podmień sekret DB_HASLO w GitHubie.\n\n";

          file_put_contents('konfiguracja/config.php',
              $naglowek . 'return ' . var_export($config, true) . ";\n");

          echo "Wygenerowano config.php (hasło: ", strlen($config['mysql_haslo']), " znaków)\n";
          PHPEOF
          php generuj-config.php
          php -l konfiguracja/config.php
          lftp -c "set cmd:fail-exit true; set sftp:connect-program 'sshpass -e ssh -a -x -o StrictHostKeyChecking=yes'; open -u '$UZYTKOWNIK',dummy sftp://$HOST; cd $ZDALNY_KATALOG/admin/inc; put konfiguracja/config.php -o config.php"
          echo "config.php wgrany"

      # Osobno i BEZ --delete: logotypy sponsorów z repozytorium mają trafić
      # na serwer przy pierwszym wdrożeniu, ale pliki wgrane później przez
      # panel muszą przetrwać. Brak --delete oznacza "dodawaj, nigdy nie usuwaj".
      - name: Uzupełnij uploads (bez kasowania)
        env:
          HOST: ${{ secrets.FTP_HOST }}
          UZYTKOWNIK: ${{ secrets.FTP_USER }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set cmd:fail-exit true; set sftp:connect-program 'sshpass -e ssh -a -x -o StrictHostKeyChecking=yes'; open -u '$UZYTKOWNIK',dummy sftp://$HOST; mirror --reverse --verbose wysylka/uploads/ $ZDALNY_KATALOG/uploads/"
