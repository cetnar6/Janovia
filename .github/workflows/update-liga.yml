name: Aktualizacja tabeli i terminarza

on:
  schedule:
    # 04:00 UTC = 06:00 czasu polskiego latem, 05:00 zimą.
    # GitHub liczy cron wyłącznie w UTC — nie zna czasu letniego.
    - cron: '0 4 * * *'
  workflow_dispatch:        # pozwala uruchomić ręcznie z zakładki Actions

permissions:
  contents: write           # workflow zapisuje odświeżony data/liga.json

jobs:
  aktualizuj:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pobierz dane z 90minut.pl
        run: python update_liga.py

      # Sezony zakończone są zapisane raz i nie pobierane ponownie —
      # tylko bieżący sezon jest odświeżany przy każdym uruchomieniu.
      - name: Pobierz archiwalne sezony z 90minut.pl
        run: python update_archiwum.py

      # Nie przerywa całego przebiegu, gdy token wygaśnie —
      # tabela ma się odświeżyć nawet wtedy, gdy Facebook odmówi.
      - name: Pobierz posty z Facebooka
        continue-on-error: true
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: |
          if [ -z "$FB_TOKEN" ]; then
            echo "Brak sekretu FB_TOKEN — pomijam posty z Facebooka."
            exit 0
          fi
          python update_fb.py

      - name: Zapisz zmiany, jeśli coś się zmieniło
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Bez zmian — nic nie commituję."
            exit 0
          fi

          git add data/
          git commit -m "Aktualizacja danych (90minut.pl, Facebook)"
          git push
