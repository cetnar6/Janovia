<body>

    <!-- ===== NAGŁÓWEK ===== -->
    <header class="header is-stuck" id="header">
        <div class="header__bg"></div>
        <div class="header__inner">

            <div class="header__side">
                <input type="checkbox" id="nav-toggle" class="nav-toggle">
                <label for="nav-toggle" class="burger" aria-label="Menu"><span></span></label>

                    <a href="index.html#aktualnosci">Aktualności</a>
                    <a href="index.html#mecze">Mecze</a>

                    <a class="nav__zwiniete" href="index.html#tabela">Tabela</a>

            <div class="header__side header__side--end">

                <a href="archiwum.html">Archiwalne sezony</a>
                <a href="index.html#kontakt">Kontakt</a>
            </div>

        </div>
    </header>

    <!-- ===== SPOTKANIE I SKŁAD =====
         Jedna sekcja, nie dwie: karta meczu i skład to ta sama rzecz
         oglądana z dwóch stron, a osobne sekcje dokładały między nimi
         podwójny margines i rozrywały je na dwa ekrany. -->
    <section class="section section--pierwsza">
        <div class="wrap">
            <!-- Nagłówek bez oprawy wizualnej: na ekranie wystarcza karta
                 spotkania, ale strona bez h1 jest niema dla czytników ekranu
                 i dla wyszukiwarek. Nazwy drużyn wpisuje tu script.js. -->
            <h1 class="visually-hidden" id="mecz-opis">Najbliższy mecz</h1>

            <div id="mecz-karta"></div>

            <!-- Dwa widoki tego samego meczu: ustawienie zatwierdzone przed
                 pierwszym gwizdkiem i to, co dzieje się w trakcie. Zakładki,
                 nie dwie sekcje pod sobą — przebieg bez składu jest nieczytelny,
                 a oba naraz to dwa ekrany przewijania. -->
            <div class="zakladki" role="tablist" aria-label="Skład i szczegóły meczu">
                <button class="zakladka is-aktywna" type="button" role="tab"
                        id="zakladka-sklad" aria-selected="true"
                        aria-controls="panel-sklad" data-panel="sklad">Skład</button>

                <button class="zakladka" type="button" role="tab"
                        id="zakladka-szczegoly" aria-selected="false"
                        aria-controls="panel-szczegoly" data-panel="szczegoly">
                    Szczegóły
                    <span class="zakladka__zywo" id="znacznik-zywo" hidden>na żywo</span>
                </button>
            </div>

            <!-- wypełnia script.js z data/sklad.json; bez zatwierdzonego
                 składu zostaje tu zdanie wyjaśniające, a nie pustka -->
            <div id="panel-sklad" role="tabpanel" aria-labelledby="zakladka-sklad">
                <div id="mecz-sklad">
                    <p class="sklad__brak">Wczytuję skład…</p>
                </div>
            </div>

            <!-- gole i zmiany z data/przebieg.json, dopisywane w panelu trenera -->
            <div id="panel-szczegoly" role="tabpanel" aria-labelledby="zakladka-szczegoly" hidden>
                <div id="mecz-szczegoly">
                    <p class="sklad__brak">Wczytuję szczegóły…</p>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== STOPKA ===== -->
    <footer class="footer" id="kontakt">
        <div class="wrap footer__inner">
            <div class="footer__brand" data-reveal>
                <img class="crest crest--md" src="png/JanoviaJanowiec.png" alt="Herb klubu Janovia Janowiec">
                <p>LKS Janovia Janowiec<br>Janowiec 70, 39-312 Janowiec</p>
            </div>

            <div class="footer__col" data-reveal style="--d:80ms">
                <h4>Drużyna</h4>
                <a href="kadra.html">Kadra</a>
                <a href="index.html#klub">O klubie</a>
            </div>
        </div>

        <div class="footer__bottom">
            <div class="wrap">
                <p>&copy; 2026 KS Janovia Janowiec</p>
                <p>Wszelkie prawa zastrzeżone</p>
            </div>
        </div>
    </footer>

    <script src="js/lenis.min.js?v=1"></script>
    <script src="script.js?v=87"></script>
</body>
</html>
